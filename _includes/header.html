<header class="container pt-0 pb-0 mb-0">

    <!-- branding -->
    <div class="col-auto header-branding">
      <div class="d-flex align-items-center">
        <a href="/" class="flex-shrink-0">
          <img
            src="/assets/images/gomix/armored_gizmo_black-350x350.png"
            class="header-avatar"
            alt="Gizmo Gomix">
        </a>

        <div class="d-flex flex-column justify-content-center">
          <a href="/" class="text-decoration-none">
            <h1 class="site-title mb-0">{{ site.title }}</h1>

          <a href="/" class="text-decoration-none">
            <h4 class="site-tagline mb-0">{{ site.description[page.lang] }}</h4>

      </div>

    <!-- navigation -->

    <!-- search -->
    <div class="col-12 col-lg-auto px-1 pt-2">

        <script async src="https://cse.google.com/cse.js?cx=016387024853945103292:zsykhrhfoua"></script>
